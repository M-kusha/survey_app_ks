org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# android.enableJetifier was removed: it was only needed to rewrite pre-AndroidX
# support-library dependencies, and AGP 8+ dropped support for it entirely.
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# Kotlin's incremental compiler cannot reliably release its cache files on
# Windows ("Could not close incremental caches"), which fails plugin modules
# such as shared_preferences_android. Plugin sources never change between
# builds here, so incremental compilation buys nothing anyway.
kotlin.incremental=false
