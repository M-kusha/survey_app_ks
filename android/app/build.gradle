plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "org.jetbrains.kotlin.android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def requiredSigningProperties = [
    "storeFile",
    "storePassword",
    "keyAlias",
    "keyPassword",
]
def missingSigningProperties = requiredSigningProperties.findAll {
    !keystoreProperties[it]?.trim()
}
def releaseSigningReady = keystorePropertiesFile.exists() && missingSigningProperties.isEmpty()

android {
    namespace = "com.echomeet.app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        // flutter_local_notifications schedules with java.time, which only
        // exists natively from API 26. Desugaring backports it to minSdk 24.
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.echomeet.app"
        // minSdk 24 gives native multidex, so the old multiDexEnabled flag and
        // the androidx.multidex dependency are no longer needed.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            // Never produce a store artifact with the shared debug key.
            signingConfig = releaseSigningReady ? signingConfigs.release : null
        }
    }
}

def validateReleaseSigning = tasks.register("validateReleaseSigning") {
    doLast {
        if (!releaseSigningReady) {
            def detail = keystorePropertiesFile.exists()
                ? "Missing values: ${missingSigningProperties.join(', ')}"
                : "Missing android/key.properties."
            throw new GradleException(
                "Release signing is not configured. ${detail} " +
                "Copy android/key.properties.example, use the upload keystore, and keep both private."
            )
        }
        if (!file(keystoreProperties["storeFile"]).exists()) {
            throw new GradleException("Release signing storeFile does not exist.")
        }
    }
}

tasks.configureEach { task ->
    if (task.name == "preReleaseBuild") {
        task.dependsOn(validateReleaseSigning)
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
}
