name: echomeet

description: EchoMeet helps organizations coordinate appointments, surveys, and shared notes.
publish_to: 'none' # Ensures package is not accidentally published to pub.dev.

version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  easy_localization: ^3.0.3
  printing: ^5.11.1
  provider: ^6.0.5
  uuid: ^4.2.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  shared_preferences: ^2.0.17
  firebase_storage: ^13.4.6
  cloud_firestore: ^6.8.0
  cloud_functions: ^6.3.5
  firebase_core: ^4.13.0
  firebase_app_check: ^0.4.6
  firebase_auth: ^6.5.7
  flutter_local_notifications: ^22.3.0
  adaptive_theme: ^3.4.1
  image: ^4.9.1
  image_picker: ^1.0.4
  pdf: ^3.10.7
  password_strength: ^0.2.0
  firebase_messaging: ^16.5.0
  local_auth: ^3.0.2
  local_auth_android: ^2.0.9
  flutter_quill: ^11.5.1
  intl: ^0.20.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Launcher icons, generated from the sources tool/generate_icon.dart draws.
#
#     flutter test tool/generate_icon.dart   # redraw the sources
#     dart run flutter_launcher_icons        # fan them out to every platform
#
# The generated per-platform files are committed, because a checkout has to
# build without anyone knowing this step exists.
flutter_launcher_icons:
  image_path: assets/icon/icon.png

  android: true
  # Adaptive icons are two layers the launcher masks to whatever shape it likes
  # — circle, squircle, teardrop. The foreground is transparent with the mark
  # held well inside the safe area, since the outer third can be cropped.
  adaptive_icon_background: assets/icon/icon_background.png
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  # Monochrome themed icons on Android 13+, where the launcher recolours the
  # silhouette to match the wallpaper.
  adaptive_icon_monochrome: assets/icon/icon_foreground.png

  ios: true
  # The App Store rejects icons with an alpha channel outright.
  remove_alpha_ios: true

  web:
    generate: true
    image_path: assets/icon/icon.png
    background_color: "#00306B"
    theme_color: "#004B96"

  windows:
    generate: true
    image_path: assets/icon/icon.png
    icon_size: 256

  macos:
    generate: true
    image_path: assets/icon/icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/translations/

  # Bundled rather than fetched at runtime with google_fonts. Three reasons:
  # the app works offline, the web build has no flash of unstyled text while a
  # CDN font downloads, and golden tests render real glyphs instead of the
  # placeholder boxes flutter_test substitutes when no font is available.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    # Display face, headings only. Its wider apertures and flat terminals are
    # what stop the app reading as stock Material.
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
